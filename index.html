<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Công cụ tạo GIF động hiển thị thứ tự nét chữ Hán chuẩn xác, sử dụng dữ liệu Make Me a Hanzi." />
    <meta name="keywords" content="chữ hán, thứ tự nét, GIF, học tiếng Trung, hanzi, stroke order" />
    <meta property="og:title" content="Tạo GIF Nét Chữ Hán" />
    <meta property="og:description" content="Tạo GIF động hiển thị thứ tự nét chữ Hán chuẩn xác." />
    <title>Tạo GIF Nét Chữ Hán</title>
    <!-- Đặt theme trước khi vẽ để không nháy sáng khi user đã chọn tối -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
